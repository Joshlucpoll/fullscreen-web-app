# Edit the three settings marked EDIT, then run `xcodegen generate`.
name: WebApp
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  WebApp:
    type: application
    platform: iOS
    sources: [WebApp]
    settings:
      base:
        WEB_APP_URL: https://example.com              # EDIT: the site to open
        APP_DISPLAY_NAME: Web App                     # EDIT: name under the Home Screen icon
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webapp # EDIT: unique per app you install
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: WebApp/Info.plist
      properties:
        WebAppURL: $(WEB_APP_URL)
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        UILaunchScreen: {}
        UIRequiresFullScreen: true # opt out of iPad multitasking, which keeps the status bar visible
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
